version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/apps/scores-api"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/apps/traffic-generator"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/apps/scores-api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/traffic-generator"
    schedule:
      interval: "weekly"
